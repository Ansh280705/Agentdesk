##
## AgentDesk Nginx config — copy to /etc/nginx/sites-available/agentdesk
## then: sudo ln -sf /etc/nginx/sites-available/agentdesk /etc/nginx/sites-enabled/
##       sudo nginx -t && sudo systemctl restart nginx
##
## Replace YOUR_DOMAIN_OR_IP with your actual domain or server IP
##

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

    # Serve the built React frontend
    root /opt/agentdesk/apps/web/dist;
    index index.html;

    # Static assets — aggressive caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API — proxy to Node.js on port 3001
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Increase timeout for long AI responses
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;

        # Don't buffer AI streaming responses
        proxy_buffering off;
    }

    # React Router — all non-API, non-asset routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

## HTTPS — added automatically by certbot after running:
## sudo certbot --nginx -d yourdomain.com
